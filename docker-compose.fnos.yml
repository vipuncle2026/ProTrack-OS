# ============================================================
# ProTrack — 飞牛 NAS (fnOS) Docker Compose 部署
# ============================================================
# 使用方法：
# 1. 在飞牛文件管理中新建文件夹 protrack
# 2. 将此文件 + .env 放入该文件夹
# 3. 打开 Docker 管理 → 创建项目 → 选择路径
# 4. 等待拉取镜像并启动（首次约 1-3 分钟，取决于网速）
# 5. 访问 http://飞牛IP:8088
#
# 更新方式：
# GitHub 推送代码 → Actions 自动构建镜像 →
# 飞牛 Docker 面板点"重建"即可拉取最新镜像
# ============================================================

services:
  backend:
    image: ghcr.io/vipuncle2026/protrack-backend:latest
    container_name: protrack-backend
    env_file:
      - .env
    environment:
      - SQLITE_DB_PATH=/app/data/protrack.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/vipuncle2026/protrack-frontend:latest
    container_name: protrack-frontend
    env_file:
      - .env
    ports:
      - "${PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
