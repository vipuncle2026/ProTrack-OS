services:
  backend:
    build: ./backend
    container_name: protrack-backend
    environment:
      - SECRET_KEY=${SECRET_KEY:-protrack-change-me-in-production-use-env-file}
      - SEED_DATA=${SEED_DATA:-admin_only}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - SQLITE_DB_PATH=/app/data/protrack.db
    volumes:
      - protrack_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - protrack

  frontend:
    build: .
    container_name: protrack-frontend
    ports:
      - "${PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    networks:
      - protrack

volumes:
  protrack_data:
    driver: local

networks:
  protrack:
    driver: bridge
